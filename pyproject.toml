[project]
name = "reward-model-bias"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.64.0",
    "cachetools>=5.5.0",
    "datasets>=4.0.0",
    "huggingface-hub>=0.36.0",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "json-repair>=0.54.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "nbformat>=5.10.4",
    "openai>=1.102.0",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.1",
    "sentence-transformers>=5.1.0",
    "slist>=0.3.15",
    "streamlit>=1.49.1",
    "tenacity>=9.1.2",
    "tiktoken>=0.11.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers>=4.55.4",
    "wandb>=0.21.2",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pyright]
typeCheckingMode = "off"

[tool.ruff.lint]
ignore = ["E402", "F401", "F403", "F405", "F541", "F722", "F821"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
